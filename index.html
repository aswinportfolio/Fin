<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#151517">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Finance Autopilot</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECECEE;--card:#fff;--ink:#111;--mut:#52525B;--in:#F4F4F6;--line:#E4E4E7;--dark:#151517;--onDark:#fff;--acc:#2F7BE8;--accBg:#E3EFFD;--accInk:#0B58B0;--ok:#0F7B4B;--okBg:#DDF3E8;--warn:#B42318;--warnBg:#FDE8E6;--pill:#151517;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0E10;--card:#1A1A1D;--ink:#F4F4F5;--mut:#A1A1AA;--in:#242428;--line:#303036;--dark:#26262B;--acc:#5B9BF2;--accBg:#1B2D45;--accInk:#9CC4FA;--ok:#5FD39B;--okBg:#173226;--warn:#FF8A80;--warnBg:#3A1D1B;--pill:#2A2A2F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0E10;--card:#1A1A1D;--ink:#F4F4F5;--mut:#A1A1AA;--in:#242428;--line:#303036;--dark:#26262B;--acc:#5B9BF2;--accBg:#1B2D45;--accInk:#9CC4FA;--ok:#5FD39B;--okBg:#173226;--warn:#FF8A80;--warnBg:#3A1D1B;--pill:#2A2A2F;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#app{max-width:430px;margin:0 auto;padding:16px 16px 110px}
.h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.av{width:44px;height:44px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.ai{border:0;background:var(--dark);color:var(--onDark);border-radius:22px;padding:0 14px;height:44px;display:flex;align-items:center;gap:8px;font:600 13px Inter,sans-serif;cursor:pointer}
.d{width:9px;height:9px;border-radius:50%;background:#7A7A82}.on .d{background:#3DDC97}
.c{background:var(--card);border-radius:26px;padding:18px;margin-bottom:12px}
.k{background:var(--dark);color:var(--onDark);border-radius:26px;padding:18px;margin-bottom:12px}
.k .l{color:#B8B8C0}
.l{font-size:13px;color:var(--mut)}
.big{font-size:32px;font-weight:700;letter-spacing:-.5px;margin:4px 0}
.t{font-size:15px;font-weight:600}.b{font-size:12px;color:var(--mut);margin-top:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.two{display:flex;gap:10px;margin-bottom:12px}.two>div{flex:1;background:var(--card);border-radius:20px;padding:12px;text-align:center}
.bar{height:12px;border-radius:6px;background:var(--in);overflow:hidden;display:flex;margin-top:10px}
.bar i{display:block;height:100%;transition:width .4s}
.it{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.it:first-of-type{border-top:0}
.ic{width:40px;height:40px;border-radius:50%;background:var(--dark);color:var(--onDark);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.p{font-size:11px;font-weight:600;border-radius:10px;padding:4px 9px;background:var(--accBg);color:var(--accInk);white-space:nowrap}
.p.ok{background:var(--okBg);color:var(--ok)}.p.bad{background:var(--warnBg);color:var(--warn)}.p.n{background:var(--in);color:var(--mut)}
.btn{width:100%;border:0;background:var(--ink);color:var(--bg);border-radius:22px;padding:15px;font:600 14px Inter,sans-serif;cursor:pointer;min-height:48px}
.btn:disabled{opacity:.45;cursor:default}.btn.sec{background:var(--in);color:var(--ink)}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line);background:var(--in);color:var(--ink);border-radius:18px;padding:12px 14px;font:700 24px Inter,sans-serif}
input[type=range]{width:100%;accent-color:var(--acc);height:32px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--pill);border-radius:30px;padding:7px;display:flex;gap:4px;z-index:5}
.nav button{border:0;background:none;color:#A8A8B0;font:600 13px Inter,sans-serif;padding:12px 13px;border-radius:24px;cursor:pointer;min-height:44px}
.nav button.on{background:#3A3A40;color:#fff}
.mini{border:0;background:var(--in);color:var(--ink);border-radius:16px;padding:9px 13px;font:600 12px Inter,sans-serif;cursor:pointer;min-height:40px}.mini:disabled{opacity:.4}.up{color:var(--ok)}.dn{color:var(--warn)}
.vs{display:flex;gap:12px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px;scroll-snap-type:x mandatory}.vid{flex:none;width:210px;background:var(--card);border-radius:22px;padding:10px;color:inherit;text-decoration:none;scroll-snap-align:start}.th{height:108px;border-radius:16px;background:var(--dark);display:flex;align-items:center;justify-content:center;margin-bottom:8px}.inp2{width:100%;border:1px solid var(--line);background:var(--in);color:var(--ink);border-radius:16px;padding:12px 14px;font:600 16px Inter,sans-serif;margin-bottom:12px}.mini.sel{background:var(--ink);color:var(--bg)}
.tip{font-size:13px;line-height:1.5;color:#D8D8DE;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav" aria-label="Main"></nav>
<script>
var KEY='aifa-v2';
var init=function(){return{name:'Aswin',email:'',goal:'',risk:'Balanced',theme:'auto',ef:0,efM:6,goals:[{n:'New laptop',t:1200,s:300},{n:'Vacation',t:2500,s:0}],conn:{broker:false,mf:false},pend:{},mf:[],stocks:[],view:'home',income:5200,sav:20,auto:true,bal:0,saved:0,applied:false,log:[],
items:[
{id:1,n:'Internet',k:'Bill',a:60,due:'12 Nov',s:'due'},
{id:2,n:'Electricity',k:'Bill',a:84,due:'15 Nov',s:'due'},
{id:3,n:'Rent',k:'Bill',a:1676,due:'1 Dec',s:'due'},
{id:4,n:'Credit card',k:'Card',a:780,due:'18 Nov',s:'due'},
{id:5,n:'Home loan EMI',k:'Loan',a:1100,due:'20 Nov',s:'due',left:62000,total:100000},
{id:6,n:'Car loan EMI',k:'Loan',a:200,due:'25 Nov',s:'due',left:4000,total:21000}]}};
var S=init();
try{var r=localStorage.getItem(KEY);if(r){S=Object.assign(init(),JSON.parse(r))}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(n){return '$'+Math.round(n).toLocaleString('en-US')}
function plan(){var ob=0;S.items.forEach(function(i){ob+=i.a});
var sv=Math.round(S.income*S.sav/100),short=false;
if(S.income-ob-sv<0){sv=Math.max(0,S.income-ob);short=S.income<ob}
var fx=Math.max(0,S.income-ob-sv);
var g=function(k){return S.items.filter(function(i){return i.k===k}).reduce(function(s,i){return s+i.a},0)};
return{ob:ob,sv:sv,fx:fx,short:short,bill:g('Bill'),loan:g('Loan'),card:g('Card')}}
var COL={Bills:'#151517',Loans:'#2F7BE8',Card:'#8FBFFA',Savings:'#7C7C85',Flex:'#C9C9D0'};
function seg(P){var t=Math.max(S.income,1);var o=[['Bills',P.bill],['Loans',P.loan],['Card',P.card],['Savings',P.sv],['Flex',P.fx]];
return '<div class="bar" role="img" aria-label="Income split">'+o.map(function(x){return '<i style="width:'+(x[1]/t*100)+'%;background:'+COL[x[0]]+'"></i>'}).join('')+'</div>'}
function ini(){var w=(S.name||'U').trim().split(/\s+/);return (w[0][0]+(w[1]?w[1][0]:'')).toUpperCase()}
function hdr(){return '<div class="h"><button class="av" style="border:0;color:var(--ink);cursor:pointer;font-family:inherit" onclick="go(\'profile\')" aria-label="Open profile">'+ini()+'</button><button class="ai '+(S.auto?'on':'')+'" onclick="tog()" aria-pressed="'+S.auto+'"><span class="d"></span>Autopilot '+(S.auto?'on':'off')+'</button></div>'}
function tog(){S.auto=!S.auto;save();draw()}
function stat(i){return i.s==='paid'?'<span class="p ok">Paid</span>':i.s==='fail'?'<span class="p bad">Low balance</span>':'<span class="p n">'+(S.auto?'Auto-pay':'Due')+'</span>'}
function list(){return S.items.map(function(i){return '<div class="it"><div class="ic">'+i.n.slice(0,2).toUpperCase()+'</div><div style="flex:1"><div class="t">'+i.n+'</div><div class="b">'+i.k+' · '+i.due+'</div></div><div style="text-align:right"><div class="t">'+$(i.a)+'</div>'+stat(i)+'</div></div>'}).join('')}
function paidSum(){return S.items.filter(function(i){return i.s==='paid'}).reduce(function(s,i){return s+i.a},0)}
function home(){var P=plan(),ps=paidSum();
return hdr()+'<div class="k"><div class="l">Spendable balance</div><div class="big">'+$(S.bal)+'</div><div class="row"><span class="l">Savings pot '+$(S.saved)+'</span><span class="p">'+(S.applied?'Plan active':'No plan yet')+'</span></div></div>'+
'<div class="c"><div class="row"><span class="t">AI monthly split</span><span class="l">'+$(S.income)+'</span></div>'+seg(P)+'<div class="row b" style="margin-top:10px"><span>Bills '+$(P.bill)+'</span><span>Loans '+$(P.loan)+'</span><span>Card '+$(P.card)+'</span><span>Save '+$(P.sv)+'</span></div></div>'+
vids()+'<div class="two"><div><div class="l">Paid</div><div class="t">'+$(ps)+'</div></div><div><div class="l">Still due</div><div class="t">'+$(P.ob-ps)+'</div></div></div>'+
'<div class="c"><div class="t">Upcoming payments</div>'+list()+'</div>'+
'<button class="btn" onclick="run()" '+(S.applied?'':'disabled')+'>Run autopilot now</button>'+(S.applied?'':'<p class="b" style="text-align:center">Apply your plan first (Plan tab).</p>')}
function planV(){var P=plan();
var loan=S.items.filter(function(i){return i.k==='Loan'})[0],extra=Math.round(P.fx*0.5/10)*10;
var tip=P.short?'Your income is '+$(P.ob-S.income)+' short of your fixed payments. Autopilot will pay by due date until the balance runs out.':
extra>0?'After fixed payments and savings you have '+$(P.fx)+' left. Putting '+$(extra)+' extra toward '+loan.n+' each month would reduce interest and finish it sooner.':'Everything is allocated. Lower the savings rate if you want some flexible money.';
var rows=[['Bills',P.bill],['Loans',P.loan],['Credit card',P.card],['Savings',P.sv],['Flexible',P.fx]];
return hdr()+'<div class="c"><label for="inc">Monthly income</label><input class="inp" id="inc" inputmode="numeric" value="'+S.income+'" oninput="setInc(this.value)"><div style="margin-top:14px"><label for="sv">Savings goal: '+S.sav+'%</label><input type="range" id="sv" min="0" max="40" value="'+S.sav+'" oninput="setSav(this.value)"></div></div>'+
'<div class="c" id="alloc">'+allocH(rows,P)+'</div>'+
'<div class="k"><div class="row"><span class="t">AI tip</span><span class="p">Insight</span></div><div class="tip" id="tip">'+tip+'</div></div>'+
'<button class="btn" onclick="apply()" '+(S.applied?'disabled':'')+'>'+(S.applied?'Plan applied this month':'Add income &amp; apply plan')+'</button>'}
function allocH(rows,P){return seg(P)+rows.map(function(r){return '<div class="row" style="padding-top:12px"><span class="t">'+r[0]+'</span><span class="t">'+$(r[1])+' <span class="b">'+Math.round(r[1]/Math.max(S.income,1)*100)+'%</span></span></div>'}).join('')}
function setInc(v){S.income=Math.max(0,parseInt(String(v).replace(/\D/g,''))||0);save();upd()}
function setSav(v){S.sav=+v;save();var el=document.querySelector('label[for=sv]');if(el)el.textContent='Savings goal: '+S.sav+'%';upd()}
function upd(){var P=plan(),a=document.getElementById('alloc');if(!a)return;
a.innerHTML=allocH([['Bills',P.bill],['Loans',P.loan],['Credit card',P.card],['Savings',P.sv],['Flexible',P.fx]],P);
var tp=document.getElementById('tip');if(tp)tp.textContent=P.short?'Your income is '+$(P.ob-S.income)+' short of your fixed payments.':'Plan updated: '+$(P.sv)+' to savings, '+$(P.fx)+' flexible.'}
function apply(){var P=plan();var gap=Math.max(0,efGoal()-S.ef),toEf=Math.min(P.sv,gap);S.ef+=toEf;S.bal=S.income-P.sv;S.saved+=P.sv-toEf;S.applied=true;S.view='home';save();draw();if(S.auto)setTimeout(run,700)}
function run(){if(!S.applied)return;var q=S.items.filter(function(i){return i.s!=='paid'});
q.forEach(function(i,n){setTimeout(function(){if(S.bal>=i.a){S.bal-=i.a;i.s='paid';if(i.left!=null)i.left=Math.max(0,i.left-Math.round(i.a*0.75))}else i.s='fail';save();draw()},n*550+200)})}
function bills(){var loans=S.items.filter(function(i){return i.k==='Loan'});
return hdr()+'<div class="c"><div class="l">Total scheduled</div><div class="big">'+$(plan().ob)+'</div></div>'+
'<div class="c"><div class="t">Loan progress</div>'+loans.map(function(l){var p=Math.round((1-l.left/l.total)*100);return '<div class="row" style="margin-top:12px"><span class="b">'+l.n+'</span><span class="b">'+p+'% paid · '+$(l.left)+' left</span></div><div class="bar"><i style="width:'+p+'%;background:var(--acc)"></i></div>'}).join('')+'</div>'+
'<div class="c"><div class="t">Payment queue</div>'+list()+'</div>'+
'<button class="btn sec" onclick="reset()">Reset demo</button>'}

function efGoal(){return plan().ob*S.efM}
function invVal(){return S.mf.reduce(function(s,h){return s+h.v},0)+S.stocks.reduce(function(s,h){return s+h.q*h.p},0)}
function invCost(){return S.mf.reduce(function(s,h){return s+h.c},0)+S.stocks.reduce(function(s,h){return s+h.q*h.c},0)}
function pc(v,c){var r=c?(v-c)/c*100:0;return '<span class="'+(r>=0?'up':'dn')+'">'+(r>=0?'+':'')+r.toFixed(1)+'%</span>'}
function pbar(p){return '<div class="bar"><i style="width:'+p+'%;background:var(--acc)"></i></div>'}
function efTop(n){if(S.bal>=n){S.bal-=n;S.ef+=n;save();draw()}}
function setM(v){S.efM=+v;save();draw()}
function goalAdd(i){if(S.saved>=100){S.saved-=100;S.goals[i].s=Math.min(S.goals[i].t,S.goals[i].s+100);save();draw()}}
function connect(k){if(S.conn[k]){S.conn[k]=false;if(k==='broker')S.stocks=[];else S.mf=[];save();draw();return}
S.pend[k]=true;draw();setTimeout(function(){S.pend[k]=false;S.conn[k]=true;
if(k==='broker')S.stocks=[{s:'AAPL',q:4,p:228,c:195},{s:'MSFT',q:2,p:420,c:380},{s:'NVDA',q:6,p:140,c:118}];
else S.mf=[{n:'Total Market Index Fund',v:3200,c:2900},{n:'Short-term Bond Fund',v:1500,c:1450}];
save();draw()},1100)}
function refresh(){var j=function(x){return x*(1+(Math.random()-0.45)*0.04)};S.stocks.forEach(function(h){h.p=Math.round(j(h.p)*100)/100});S.mf.forEach(function(h){h.v=Math.round(j(h.v))});save();draw()}
function sipAmt(){return Math.max(50,Math.round(plan().sv*0.5/10)*10)}
function sip(){var a=sipAmt();if(S.conn.mf&&S.bal>=a&&S.mf.length){S.bal-=a;S.mf[0].v+=a;S.mf[0].c+=a;save();draw()}}
function portal(k,t,d){var on=S.conn[k],pd=S.pend[k];
return '<div class="row" style="padding:10px 0"><div><div class="t">'+t+'</div><div class="b">'+(pd?'Authorizing…':on?'Connected (demo)':d)+'</div></div><button class="mini" onclick="connect(\''+k+'\')" '+(pd?'disabled':'')+'>'+(on?'Disconnect':'Connect')+'</button></div>'}
function wealth(){var P=plan(),g=efGoal(),ep=Math.min(100,Math.round(S.ef/Math.max(g,1)*100)),inv=invVal(),nw=S.bal+S.saved+S.ef+inv;
var rows=S.mf.map(function(h){return '<div class="it"><div class="ic">MF</div><div style="flex:1"><div class="t">'+h.n+'</div><div class="b">Mutual fund</div></div><div style="text-align:right"><div class="t">'+$(h.v)+'</div><div class="b">'+pc(h.v,h.c)+'</div></div></div>'}).join('')+
S.stocks.map(function(h){return '<div class="it"><div class="ic">'+h.s.slice(0,2)+'</div><div style="flex:1"><div class="t">'+h.s+'</div><div class="b">'+h.q+' shares @ $'+h.p.toFixed(2)+'</div></div><div style="text-align:right"><div class="t">'+$(h.q*h.p)+'</div><div class="b">'+pc(h.p,h.c)+'</div></div></div>'}).join('');
var adv=(S.ef<g?'Build your emergency fund first: '+$(g-S.ef)+' to go. New savings go there automatically until it is full.':S.conn.mf?'Emergency fund is full. Suggested monthly SIP: '+$(sipAmt())+' into your index fund.':'Emergency fund is full. Connect a mutual fund portal to start a monthly SIP of about '+$(sipAmt())+'.')+' Your risk profile: '+S.risk+'.';
return hdr()+'<div class="k"><div class="l">Net worth (sample)</div><div class="big">'+$(nw)+'</div><div class="row"><span class="l">Invested '+$(inv)+'</span><span class="p">'+(invCost()?pc(inv,invCost()).replace(/<[^>]+>/g,''):'No investments')+'</span></div></div>'+
'<div class="c"><div class="row"><span class="t">Emergency fund</span><span class="l">'+$(S.ef)+' / '+$(g)+'</span></div>'+pbar(ep)+
'<div style="margin-top:12px"><label for="em">Target: '+S.efM+' months of fixed payments</label><input type="range" id="em" min="3" max="12" value="'+S.efM+'" onchange="setM(this.value)"></div>'+
'<div class="row" style="gap:8px;margin-top:6px"><button class="mini" onclick="efTop(100)" '+(S.bal<100?'disabled':'')+'>Add $100</button><button class="mini" onclick="efTop(500)" '+(S.bal<500?'disabled':'')+'>Add $500</button></div></div>'+
'<div class="c"><div class="row"><span class="t">Savings goals</span><span class="l">Pot '+$(S.saved)+'</span></div>'+S.goals.map(function(x,i){return '<div style="padding-top:14px"><div class="row"><span class="t">'+x.n+'</span><span class="b">'+$(x.s)+' / '+$(x.t)+'</span></div>'+pbar(Math.round(x.s/x.t*100))+'<button class="mini" style="margin-top:8px" onclick="goalAdd('+i+')" '+(S.saved<100?'disabled':'')+'>Add $100 from pot</button></div>'}).join('')+'</div>'+
'<div class="c"><div class="t">Investment portals</div>'+portal('broker','Stock broker portal','Link to see your stocks')+portal('mf','Mutual fund portal','Link to see funds and SIPs')+
'<div class="b">Demo only. A real app would use each portal’s official sign-in and API.</div></div>'+
(rows?'<div class="c"><div class="row"><span class="t">Holdings</span><button class="mini" onclick="refresh()">Refresh prices</button></div>'+rows+'</div>':'')+
'<div class="k"><div class="row"><span class="t">AI suggestion</span><span class="p">Insight</span></div><div class="tip">'+adv+'</div></div>'+
(S.ef>=g&&S.conn.mf?'<button class="btn" onclick="sip()" '+(S.bal<sipAmt()?'disabled':'')+'>Invest '+$(sipAmt())+' now</button>':'')+
'<p class="b" style="text-align:center">Sample data for a prototype, not investment advice.</p>'}

var VID=[{t:'Budgeting basics: the 50/30/20 rule',q:'50 30 20 budget rule explained',g:'Budgeting'},{t:'How to build an emergency fund',q:'how to build an emergency fund',g:'Savings'},{t:'SIP and mutual funds for beginners',q:'SIP mutual funds for beginners',g:'Investing'},{t:'Stock market basics for beginners',q:'stock market basics for beginners',g:'Stocks'},{t:'Pay off credit card debt faster',q:'how to pay off credit card debt fast',g:'Debt'},{t:'Should you prepay your loan?',q:'should I prepay my loan',g:'Loans'}];
function vids(){var r=S.ef<efGoal()?1:(S.risk==='Aggressive'?3:2),L=VID.slice();var x=L.splice(r,1)[0];L.unshift(x);
return '<div class="row" style="margin:4px 2px 8px"><span class="t">Learn money skills</span><span class="b">Opens YouTube</span></div><div class="vs">'+L.map(function(v,i){return '<a class="vid" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.q)+'"><div class="th"><svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="21" fill="#fff" fill-opacity=".14"/><path d="M18 14l13 8-13 8z" fill="#fff"/></svg></div><div class="t" style="font-size:14px">'+v.t+'</div><div class="b">'+v.g+(i?'':' · Recommended for you')+'</div></a>'}).join('')+'</div>'}
function setP(k,v){S[k]=v;save()}
function setRisk(r){S.risk=r;save();draw()}
function setTheme(t,q){S.theme=t;var d=document.documentElement;if(t==='auto')d.removeAttribute('data-theme');else d.setAttribute('data-theme',t);if(!q){save();draw()}}
function profileV(){var seg=function(a,cur,fn){return a.map(function(x){return '<button class="mini '+(x[0]===cur?'sel':'')+'" onclick="'+fn+'(\''+x[0]+'\')" aria-pressed="'+(x[0]===cur)+'">'+x[1]+'</button>'}).join('')};
return '<div class="h"><button class="mini" onclick="go(\'home\')">Back</button><span class="t">Profile</span><span style="width:60px"></span></div>'+
'<div class="k" style="text-align:center"><div class="av" style="margin:0 auto 10px;width:72px;height:72px;font-size:24px;color:#111;background:#fff">'+ini()+'</div><div class="t">'+(S.name||'Your name')+'</div><div class="l">'+(S.email||'Add your email')+'</div></div>'+
'<div class="c"><label for="pn">Full name</label><input class="inp2" id="pn" value="'+S.name.replace(/"/g,'&quot;')+'" oninput="setP(\'name\',this.value)" autocomplete="name">'+
'<label for="pe">Email</label><input class="inp2" id="pe" type="email" value="'+S.email.replace(/"/g,'&quot;')+'" oninput="setP(\'email\',this.value)" autocomplete="email">'+
'<label for="pg">Main money goal</label><input class="inp2" id="pg" placeholder="e.g. Buy a home in 5 years" value="'+S.goal.replace(/"/g,'&quot;')+'" oninput="setP(\'goal\',this.value)" style="margin-bottom:0"></div>'+
'<div class="c"><div class="t">Risk profile</div><div class="b" style="margin-bottom:10px">Shapes your investing tips and recommended videos.</div><div class="row" style="justify-content:flex-start;flex-wrap:wrap">'+seg([['Conservative','Conservative'],['Balanced','Balanced'],['Aggressive','Aggressive']],S.risk,'setRisk')+'</div></div>'+
'<div class="c"><div class="t">Appearance</div><div class="row" style="justify-content:flex-start;margin-top:10px">'+seg([['auto','Auto'],['light','Light'],['dark','Dark']],S.theme,'setTheme')+'</div></div>'+
'<p class="b" style="text-align:center">Your details stay in this browser only.</p><button class="btn sec" onclick="reset()">Reset demo data</button>'}
function reset(){var keep={name:S.name,email:S.email,goal:S.goal,risk:S.risk,theme:S.theme};S=Object.assign(init(),keep);save();draw()}
function go(v){S.view=v;save();draw();window.scrollTo(0,0)}
function draw(){var v=S.view,h=v==='home'?home():v==='plan'?planV():v==='wealth'?wealth():v==='profile'?profileV():bills();
document.getElementById('app').innerHTML=h;
document.getElementById('nav').innerHTML=[['home','Home'],['plan','Plan'],['bills','Bills'],['wealth','Wealth']].map(function(x){return '<button class="'+(v===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')}
setTheme(S.theme,1);draw();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
</body>
</html>
